<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="KZYB — архивный узел. Если ты нашёл метку на стене — сигнал уже ждёт. Координаты и доступ внутри.">
  <meta property="og:site_name" content="KZYB">
  <meta property="og:title" content="KZYB // ТЫ ВИДЕЛ ЭТОТ ЗНАК">
  <meta property="og:description" content="KZYB — архивный узел. Если ты нашёл метку на стене — ты на правильном пути.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
        * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.015) 0px,
        rgba(255, 255, 255, 0.015) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 15;
    }

    #rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .stage {
      position: relative;
      z-index: 10;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .warn {
      color: #d40000;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 8px;
      margin-bottom: 58px;
      text-shadow: 0 0 12px rgba(212, 0, 0, 0.45);
      animation: flicker 6s infinite;
    }

    .aim {
      width: 96px;
      height: 96px;
      margin-bottom: 32px;
      pointer-events: auto;
      cursor: crosshair;
      transition: transform 0.2s ease;
    }

    .aim:hover {
      transform: scale(1.05);
    }

    .tag-box {
      position: relative;
      pointer-events: auto;
    }

    .tag {
      color: #f2f2f2;
      font-family: 'Arial Black', 'Segoe UI Black', sans-serif;
      font-size: clamp(64px, 9.5vw, 114px);
      font-weight: 900;
      letter-spacing: 32px;
      padding-left: 32px;
      white-space: nowrap;
      display: inline-block;
    }

    .tag.tear {
      animation: crt 0.16s steps(2, end);
    }

    @keyframes crt {
      0% { transform: translate(0, 0); clip-path: inset(0 0 0 0); opacity: 1; }
      25% { transform: translate(-5px, 1px); clip-path: inset(18% 0 52% 0); opacity: 0.85; }
      50% { transform: translate(6px, -1px); clip-path: inset(62% 0 12% 0); opacity: 0.9; }
      75% { transform: translate(-2px, 0); clip-path: inset(35% 0 40% 0); opacity: 0.75; }
      100% { transform: translate(0, 0); clip-path: inset(0 0 0 0); opacity: 1; }
    }

    @keyframes flicker {
      0%, 92%, 96%, 100% { opacity: 0.92; }
      93% { opacity: 0.25; }
      95% { opacity: 0.85; }
      97% { opacity: 0.35; }
    }

    .ref {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 20;
      color: #363636;
      font-size: 11px;
      letter-spacing: 1.5px;
      line-height: 1.6;
      user-select: text;
      transition: color 0.3s;
    }

    .ref:hover {
      color: #7a7a7a;
    }

    #dump {
      display: none;
      position: fixed;
      bottom: 84px;
      left: 20px;
      z-index: 25;
      background: rgba(5, 5, 5, 0.92);
      border: 1px solid #444;
      padding: 12px 16px;
      font-size: 12px;
      color: #b0b0b0;
      letter-spacing: 1px;
      line-height: 1.7;
      user-select: text;
    }

    #dump span {
      color: #d40000;
    }

    #snd {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.85);
      color: #666;
      border: 1px solid #2b2b2b;
      padding: 6px 12px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    #snd:hover {
      color: #fff;
      border-color: #666;
    }
  </style>
</head>
<body>

  <h1 style="position:absolute;left:-9999px;">KZYB — ТЫ ВИДЕЛ ЭТОТ ЗНАК</h1>
  <canvas id="rain"></canvas>

  <div class="stage">
    <div class="warn">WE ARE WATCHING YOU</div>

    <svg class="aim" id="aim" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="24" fill="none" stroke="#fff" stroke-width="3" />
      <line x1="50" y1="4" x2="50" y2="96" stroke="#fff" stroke-width="3" />
      <line x1="4" y1="50" x2="96" y2="50" stroke="#fff" stroke-width="3" />
    </svg>

    <div class="tag-box">
      <div class="tag" id="tag">KZYB</div>
    </div>
  </div>

  <div class="ref" id="ref"></div>
  <div id="dump"></div>

  <button id="snd">[SOUND: OFF]</button>
  <script>
    // Отрисовка пасхалки через JS, чтобы поисковик не светил её раньше времени в выдаче
    const b64 = 'NTMuMTE4NTg4NzAyNzYyOTcsIDkxLjM4NTY5NDU1ODM5NjMx';
    const hint = '1 3ТАЖ // ГД3 Т3МН0 // 1Щ1Т3 НА СТ3НАХ';

    document.getElementById('ref').innerHTML =
      'REF // KSRZ-04<br>' + b64 + '<br>' + hint;

    document.getElementById('dump').innerHTML =
      '<span>[SIGNAL // DECODE]</span><br>' +
      'B64: ' + b64 + '<br>' +
      'LOC: ' + hint.replace(/ \/\/ /g, ' ');

    const c = document.getElementById('rain');
    const ctx = c.getContext('2d');

    let w = c.width = window.innerWidth;
    let h = c.height = window.innerHeight;

    const chars = ['K', 'Z', 'Y', 'B'];
    const fs = 16;
    const gap = 38;
    let cols = Math.floor(w / gap);
    let drops = [];

    function resetDrops() {
      cols = Math.floor(w / gap);
      drops = [];
      for (let i = 0; i < cols; i++) {
        drops[i] = {
          y: Math.random() * -45,
          v: 0.11 + Math.random() * 0.18,
          s: Math.floor(Math.random() * 4),
          on: Math.random() > 0.28,
          row: -1
        };
      }
    }
    resetDrops();

    window.addEventListener('resize', () => {
      w = c.width = window.innerWidth;
      h = c.height = window.innerHeight;
      resetDrops();
    });

    function loop() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.045)';
      ctx.fillRect(0, 0, w, h);
      ctx.font = fs + 'px "Courier New", monospace';

      for (let i = 0; i < drops.length; i++) {
        const d = drops[i];
        if (!d.on) continue;

        const r = Math.floor(d.y);
        if (r !== d.row && r >= 0) {
          d.row = r;
          const ch = chars[(r + d.s) % chars.length];
          ctx.fillStyle = Math.random() > 0.92 ? '#dcdcdc' : '#585858';
          ctx.fillText(ch, i * gap + 12, r * fs);
        }

        d.y += d.v;

        if (d.y * fs > h + 60 && Math.random() > 0.985) {
          d.y = Math.random() * -25;
          d.row = -1;
          d.v = 0.11 + Math.random() * 0.18;
        }
      }
      requestAnimationFrame(loop);
    }
    loop();

    let ac = null;
    let soundOn = false;
    let gainNode = null;
    const sndBtn = document.getElementById('snd');

    function bootAudio() {
      if (ac) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC();

      gainNode = ac.createGain();
      gainNode.gain.value = 0.22;
      gainNode.connect(ac.destination);

      const o1 = ac.createOscillator();
      const o2 = ac.createOscillator();
      const lp = ac.createBiquadFilter();

      o1.type = 'sawtooth';
      o1.frequency.value = 52;

      o2.type = 'triangle';
      o2.frequency.value = 78;

      lp.type = 'lowpass';
      lp.frequency.value = 125;

      o1.connect(lp);
      o2.connect(lp);
      lp.connect(gainNode);

      o1.start();
      o2.start();
    }

    function staticBurst() {
      if (!ac || !soundOn) return;
      const len = ac.sampleRate * 0.06;
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const out = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        out[i] = (Math.random() * 2 - 1) * 0.3;
      }

      const src = ac.createBufferSource();
      src.buffer = buf;

      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 950;

      const g = ac.createGain();
      g.gain.setValueAtTime(0.12, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.06);

      src.connect(bp);
      bp.connect(g);
      g.connect(ac.destination);
      src.start();
    }

    function setSound(force = false) {
      if (!ac) bootAudio();
      if (ac.state === 'suspended') ac.resume();

      soundOn = force ? true : !soundOn;
      gainNode.gain.setTargetAtTime(soundOn ? 0.22 : 0.0001, ac.currentTime, 0.12);
      sndBtn.textContent = soundOn ? '[SOUND: ON]' : '[SOUND: OFF]';
      sndBtn.style.color = soundOn ? '#dcdcdc' : '#666';
    }

    document.body.addEventListener('click', (e) => {
      if (e.target === sndBtn) return;
      if (!soundOn) setSound(true);
    });

    sndBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setSound();
    });

    const tag = document.getElementById('tag');
    const aim = document.getElementById('aim');
    const dump = document.getElementById('dump');
    const base = 'KZYB';
    const noiseChars = ['K', 'Z', 'Y', 'B', '0', '1', '#', '_'];
    let taps = 0;

    function glitch() {
      tag.classList.add('tear');
      staticBurst();

      const i = Math.floor(Math.random() * 4);
      const a = base.split('');
      a[i] = noiseChars[Math.floor(Math.random() * noiseChars.length)];
      tag.textContent = a.join('');

      setTimeout(() => {
        tag.textContent = base;
        tag.classList.remove('tear');
      }, 130);
    }

    aim.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!soundOn) setSound(true);
      glitch();
      taps++;
      if (taps >= 5) {
        dump.style.display = 'block';
      }
    });

    setInterval(() => {
      if (Math.random() > 0.6) glitch();
    }, 3400);
  </script>
</body>
</html>
